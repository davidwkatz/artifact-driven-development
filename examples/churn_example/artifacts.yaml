project:
  id: churn_example
  name: ADD Churn Example
  status: in_progress
  description: >
    Demonstrates Artifact-Driven Development using a customer
    churn prediction project.

artifacts:

  - id: business_objective
    path: artifacts/business_objective.md
    type: business_definition
    status: complete
    version: "1.0"
    description: >
      Records the business objective, operational constraints,
    depends_on: []
    consumed_by:
      - churn_definition
      - source_data_contract

  - id: churn_definition
    path: artifacts/churn_definition.md
    type: business_definition
    status: complete
    version: "1.0"
    description: >
      Records the business definition of churn and the prediction label.
    depends_on:
      - business_objective
    consumed_by:
      - source_data_contract
      - synthetic_data_spec
  - id: open_questions
    path: artifacts/open_questions.md
    type: decision_support
    status: active
    version: "1.0"
    description: >
      Tracks unresolved business and technical questions.
    depends_on:
      - business_objective
      - churn_definition
    consumed_by: []

  - id: source_data_contract
    path: artifacts/source_data_contract.md
    type: data_contract
    status: complete
    version: "1.0"
    description: >
      Defines the raw source tables and integrity constraints.
    depends_on:
      - business_objective
      - churn_definition
    consumed_by:
      - synthetic_data_spec
      - synthetic_data_generator

  - id: synthetic_data_spec
    path: artifacts/synthetic_data_spec.md
    type: data_generation_specification
    status: complete
    version: "1.0"
    description: >
      Defines the assumptions used to generate synthetic customer data.
    depends_on:
      - source_data_contract
    consumed_by:
      - synthetic_data_config
      - synthetic_data_generator

  - id: synthetic_data_config
    path: config/synthetic_data.yaml
    type: configuration
    status: complete
    version: "1.0"
    description: >
      Machine-readable parameters for the synthetic data generator.
    depends_on:
      - synthetic_data_spec
    consumed_by:
      - synthetic_data_generator

  - id: synthetic_data_generator
    path: src/generate_synthetic_data.py
    type: executable
    status: planned
    description: >
      Generates the synthetic source data.
    depends_on:
      - source_data_contract
      - synthetic_data_spec
      - synthetic_data_config
    consumed_by:
      - synthetic_source_data

  - id: synthetic_source_data
    path: data/raw/
    type: dataset
    status: planned
    description: >
      Generated source data for the churn example.
    depends_on:
      - synthetic_data_generator
    consumed_by: []

views:

  newcomer:
    artifacts:
      - business_objective
      - churn_definition
      - open_questions

  data_generation:
    artifacts:
      - source_data_contract
      - synthetic_data_spec
      - synthetic_data_config
      - synthetic_data_generator
      - synthetic_source_data
